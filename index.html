:root{--ink:#12304a;--teal:#0e7c8f;--teal2:#0b5566;--gold:#f2b632;--gold2:#ffe08a;--ok:#2fa866;--bad:#e5484d;--panel:#f3fafd}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:'AmiriG','Amiri','Noto Naskh Arabic','Traditional Arabic','Geeza Pro','Segoe UI',serif;color:#fff;background:#061c2b;min-height:100dvh;overflow-x:hidden;font-size:18px;line-height:1.55}
.bg{position:fixed;inset:0;z-index:-1;background:
 radial-gradient(900px 520px at 50% -8%,#1c8396 0%,transparent 62%),
 radial-gradient(700px 480px at 100% 105%,#12566a 0%,transparent 60%),
 linear-gradient(#0a2f43,#061c2b)}
.bub{position:fixed;bottom:-40px;border-radius:50%;border:2px solid rgba(255,255,255,.18);background:rgba(255,255,255,.05);animation:rise linear infinite;z-index:-1}
@keyframes rise{to{transform:translateY(-115vh)}}
button{font-family:inherit}

/* ---------- home ---------- */
.top{display:flex;align-items:center;justify-content:space-between;padding:12px 14px 0;max-width:1000px;margin:0 auto}
.icbtn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:12px;padding:6px 12px;font-size:.95rem;cursor:pointer}
.gems{display:flex;gap:8px;align-items:center}
.gem{width:30px;height:30px;opacity:.28;filter:grayscale(1);transition:.5s}
.gem.on{opacity:1;filter:none;transform:scale(1.15)}
header.hero{text-align:center;padding:6px 16px 4px}
h1{margin:4px 0 2px;font-size:clamp(1.9rem,6.5vw,3.1rem);line-height:1.2;background:linear-gradient(#fff3b8,#f2b632 70%,#c98a12);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:700;padding:.05em 0 .22em;filter:drop-shadow(0 2px 0 rgba(0,0,0,.35))}
.sub{margin:0;opacity:.9;font-size:1.05rem}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px 8px;max-width:1000px;margin:10px auto 0;padding:0 10px 30px}
@media(min-width:860px){.grid{grid-template-columns:repeat(4,1fr);gap:20px;margin-top:34px}}
.chest{background:none;border:0;color:inherit;display:flex;flex-direction:column;align-items:center;cursor:pointer;padding:0;position:relative}
.csv{width:100%;max-width:230px;height:auto;display:block;overflow:visible}
.chest:hover .csv,.chest:focus-visible .csv{transform:translateY(-4px)}
.csv{transition:transform .25s}
.cl{margin-top:2px;padding:7px 12px;border-radius:14px;background:rgba(255,255,255,.1);border:1.5px solid rgba(255,220,130,.45);text-align:center;min-width:130px;position:relative}
.cl b{display:block;font-size:1.2rem;line-height:1.3}
.cl small{display:block;opacity:.8;font-size:.85rem;line-height:1.3}
.num{position:absolute;top:-12px;right:-6px;width:26px;height:26px;border-radius:50%;background:var(--gold);color:#4a2d00;font-weight:700;display:grid;place-items:center;font-size:.95rem;box-shadow:0 2px 0 #9a6a08}
.chk{display:none;position:absolute;top:-12px;left:-6px;width:26px;height:26px;border-radius:50%;background:var(--ok);color:#fff;place-items:center;font-size:1rem}
.chest.done .chk{display:grid}
.chest.done .cl{border-color:#7be0a2;background:rgba(60,180,110,.22)}
.chest.locked .cl{opacity:.75}
.chest.ready .csv{animation:bounce 1.2s ease-in-out infinite}
.chest.ready .cl{border-color:var(--gold2);background:rgba(242,182,50,.25)}
@keyframes bounce{50%{transform:translateY(-8px)}}
.foot{text-align:center;padding:0 0 28px;opacity:.9}
.foot button{margin-top:6px}

/* chest svg states */
.lid-closed{transform-origin:150px 122px;transition:transform .55s cubic-bezier(.3,1.5,.5,1),opacity .3s .2s}
.chest.open .lid-closed{opacity:0;transform:translateY(-34px) scale(.92)}
.lid-open,.gold-pile,.glowg,.sp{opacity:0;transform-origin:150px 120px;transition:opacity .45s .15s,transform .6s .1s}
.lid-open{transform:scale(.9)}
.gold-pile{transform:translateY(14px)}
.chest.open .lid-open,.chest.open .gold-pile,.chest.open .glowg{opacity:1;transform:none}
.chest.open .sp{opacity:1;animation:spk 1.6s ease-in-out infinite}
.sp:nth-of-type(2){animation-delay:.3s!important}.sp:nth-of-type(3){animation-delay:.7s!important}.sp:nth-of-type(4){animation-delay:1s!important}
@keyframes spk{0%,100%{transform:scale(.2);opacity:0}50%{transform:scale(1);opacity:1}}
.glowg circle{animation:pulse 2.2s ease-in-out infinite;transform-origin:150px 100px}
@keyframes pulse{50%{transform:scale(1.12);opacity:.8}}
.chest.locked .body,.chest.locked .lid-closed{filter:saturate(.35) brightness(.72)}
.padlock{transform-origin:150px 150px;transition:transform .5s,opacity .5s}
.chest:not(.locked) .padlock{opacity:0;transform:translateY(-40px) rotate(25deg) scale(.7);pointer-events:none}
.imgc{position:relative;aspect-ratio:1/.9}.imgc img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;transition:opacity .3s}
.imgc .io{opacity:0}.chest.open .imgc .io{opacity:1}.chest.open .imgc .ic{opacity:0}

/* ---------- overlay / panel ---------- */
.ov{position:fixed;inset:0;background:rgba(3,14,22,.8);display:none;align-items:center;justify-content:center;z-index:50}
.ov.show{display:flex}
.panel{background:var(--panel);color:var(--ink);width:min(980px,100%);height:100dvh;overflow-y:auto;overflow-x:hidden;position:relative;animation:pin .35s ease-out;scroll-behavior:auto}
@media(min-width:860px){.panel{height:auto;max-height:94vh;border-radius:22px;box-shadow:0 20px 60px rgba(0,0,0,.5)}}
@keyframes pin{from{transform:scale(.9);opacity:0}}
.phead{position:sticky;top:0;z-index:5;background:var(--teal2);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 12px}
.phead h2{margin:0;font-size:1.25rem;flex:1;line-height:1.3}
.phead .icbtn{background:rgba(255,255,255,.16)}
.pbody{padding:12px 12px 22px}
.hint{margin:0 0 10px;font-size:1.02rem;background:#e2f3f8;border-radius:12px;padding:8px 12px;border:1px solid #bfe0ea}
.prog{font-weight:700;color:var(--teal2);margin:8px 2px;display:flex;justify-content:space-between}
.donebar{margin-top:14px;padding:14px;border-radius:16px;background:#e4f8ea;border:2px solid var(--ok);text-align:center;animation:pin .4s}
.donebar b{display:block;font-size:1.3rem;margin-bottom:6px}
.btn{background:linear-gradient(#ffd96a,#f2b632);color:#4a2d00;border:0;border-bottom:4px solid #b9780f;border-radius:14px;padding:10px 22px;font-size:1.1rem;font-weight:700;cursor:pointer}
.btn:active{transform:translateY(2px);border-bottom-width:2px}
.btn.alt{background:#fff;border:2px solid var(--teal);color:var(--teal2);border-bottom-width:4px}

/* puzzle 1 */
.dgw{position:relative;width:100%;max-width:min(760px,max(320px,calc((100dvh - 340px) * 1080 / 943)));margin:0 auto;aspect-ratio:1080/943;container-type:inline-size;border-radius:12px;overflow:hidden;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.dgw img{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none;user-select:none}
.dz{border-radius:10px;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:700;color:var(--ink);transition:background .15s,outline-color .15s}
.zpos{position:absolute;white-space:nowrap;overflow:hidden;font-size:3.3cqw;direction:rtl}
.dz.hot{outline:3px solid var(--gold);background:rgba(242,182,50,.28)}
.dz.pulse{animation:zp 1s ease-in-out infinite}
@keyframes zp{50%{background:rgba(242,182,50,.35)}}
.dz.ok{background:#dff6e7;outline:2px solid var(--ok)}
.dz.bad{animation:shake .4s;outline:3px solid var(--bad)}
@keyframes shake{20%{transform:translateX(7px)}40%{transform:translateX(-7px)}60%{transform:translateX(5px)}80%{transform:translateX(-5px)}}
.pool{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin:14px 0 0;padding:12px;border-radius:16px;background:#e6f3f8;border:2px dashed #9bc7d6;min-height:60px}
.card{touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;padding:7px 14px;border-radius:12px;background:#fff;border:2px solid var(--teal);color:var(--ink);font-weight:700;font-size:1.08rem;box-shadow:0 3px 0 rgba(14,124,143,.45);transition:transform .15s,background .15s;line-height:1.4;font-family:inherit}
.card.sel{background:#fff1b8;border-color:var(--gold);transform:translateY(-3px)}
.card.dragging{opacity:.3}
.card.used{display:none}
.card.bad{animation:shake .4s;border-color:var(--bad)}
.ghost{position:fixed;left:0;top:0;z-index:300;pointer-events:none;box-shadow:0 12px 24px rgba(0,0,0,.35);background:#fff1b8;border-color:var(--gold)}

/* puzzle 2 */
.mrow{display:flex;gap:8px;align-items:stretch;margin:8px 0}
.mname img{width:50px;height:50px;flex:none;object-fit:cover;border-radius:10px;border:2px solid rgba(255,255,255,.7);background:#fff}
.mname{flex:0 0 40%;flex-direction:row;gap:6px;padding:6px;background:var(--teal2);color:#fff;border-radius:12px;padding:8px 8px;font-weight:700;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.3;transition:background .3s}
.mrow.ok .mname{background:var(--ok)}
.slot{flex:1;min-height:56px;border:2.5px dashed #94b7c6;border-radius:12px;padding:6px 10px;font-size:1.02rem;background:#fff;line-height:1.35}
.slot.ok{border:2.5px solid var(--ok);background:#e4f8ea}
.slot.hot{border-style:solid}
.pool.cols{display:grid;grid-template-columns:1fr 1fr}
@media(min-width:700px){.pool.cols{grid-template-columns:repeat(3,1fr)}}
.pool.cols .card{text-align:center;font-size:1rem}

/* puzzle 3 */
.rq{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.rq figure{margin:0;flex:0 0 150px;text-align:center}
.rq img{width:150px;max-width:100%;border-radius:12px;border:2px solid #bfe0ea;display:block}
.rq figcaption{font-size:.85rem;opacity:.75}
.qtext{flex:1 1 170px;font-size:1.25rem;font-weight:700;background:#fff;border-radius:14px;padding:12px 14px;border:2px solid #bfe0ea}
.opt{display:block;width:100%;text-align:center;padding:13px;margin:10px 0;border-radius:14px;background:#fff;border:2.5px solid #94b7c6;font:inherit;font-weight:700;font-size:1.15rem;color:var(--ink);cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.08)}
.opt:hover{border-color:var(--teal)}
.opt.ok{background:#dff6e7;border-color:var(--ok)}
.opt.bad{animation:shake .4s;border-color:var(--bad);background:#fdeaea}
.opt:disabled{cursor:default}
.ans{width:100%;font:inherit;font-size:1.15rem;padding:10px 12px;border-radius:14px;border:2.5px solid #94b7c6;color:var(--ink);background:#fff;resize:vertical}
.ans.bad{animation:shake .4s;border-color:var(--bad)}
.tip{display:none;margin-top:8px;padding:10px 12px;border-radius:12px;background:#fff6dc;border:1.5px solid var(--gold)}

/* treasure card */
.namebox{display:flex;gap:8px;align-items:center;margin:0 0 12px;flex-wrap:wrap}
.namebox input{flex:1;min-width:180px;font:inherit;font-size:1.15rem;padding:9px 12px;border-radius:12px;border:2px solid #94b7c6;color:var(--ink);background:#fff}
.tcard{container-type:inline-size;max-width:640px;margin:0 auto;aspect-ratio:1000/620;border-radius:4cqw;background:radial-gradient(120% 90% at 50% 0%,#1d8aa0,#0a3550 70%);color:#fff;padding:2.2cqw;position:relative;box-shadow:0 14px 36px rgba(0,0,0,.35)}
.tcard .in{height:100%;border:.6cqw solid var(--gold);border-radius:3cqw;outline:.25cqw solid rgba(255,224,138,.7);outline-offset:-1.6cqw;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2cqw 4cqw;gap:.8cqw}
.tcard h3{margin:0;font-size:9cqw;line-height:1.1;padding-bottom:.18em;background:linear-gradient(#fff3b8,#f2b632 70%,#c98a12);-webkit-background-clip:text;background-clip:text;color:transparent}
.tcard .stars{font-size:6cqw;letter-spacing:1cqw;color:var(--gold2);line-height:1}
.tcard .to{font-size:3.4cqw;opacity:.9}
.tcard .nm{font-size:7cqw;font-weight:700;color:#fff;border-bottom:.35cqw dashed rgba(255,224,138,.8);padding:0 4cqw;min-width:40cqw;line-height:1.3}
.tcard ul{list-style:none;margin:.6cqw 0 0;padding:0;font-size:3.3cqw;text-align:right;line-height:1.55}
.tcard li:before{content:'✦ ';color:var(--gold2)}
.tcard .dt{font-size:2.8cqw;opacity:.8;margin-top:.8cqw}

/* matching: connect lines */
.mwrap{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:0 48px;margin:10px 0 4px}
.mcol{display:flex;flex-direction:column;gap:12px}
.mi{position:relative;border-radius:14px;border:2.5px solid #94b7c6;background:#fff;color:var(--ink);padding:8px;font-weight:700;display:flex;align-items:center;gap:8px;min-height:86px;line-height:1.35;user-select:none;-webkit-user-select:none;transition:background .2s,border-color .2s}
.mi.ms{background:var(--teal2);border-color:var(--teal2);color:#fff;cursor:grab;touch-action:none}
.mi.ms img{width:52px;height:52px;border-radius:10px;border:2px solid rgba(255,255,255,.7);object-fit:cover;flex:none;background:#fff}
.mi.mf{font-size:.98rem;cursor:pointer}
.mi .dot{position:absolute;top:50%;width:20px;height:20px;margin-top:-10px;border-radius:50%;background:var(--gold);border:3px solid #fff;box-shadow:0 0 0 2px var(--gold)}
.ms .dot{left:-13px}.mf .dot{right:-13px}
.mi.sel{outline:3px solid var(--gold);transform:scale(1.03)}
.mi.cand{border-color:var(--gold);border-style:dashed}
.mi.hot{outline:3px solid var(--gold);background:#fff4cc}
.mi.ok{background:#e4f8ea;border-color:var(--ok);color:var(--ink)}
.mi.ms.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.mi.ok .dot{background:var(--ok);box-shadow:0 0 0 2px var(--ok)}
.mi.bad{animation:shake .4s;border-color:var(--bad)}
.mlines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.ln{fill:none;stroke-width:5;stroke-linecap:round}
.ln.ok{stroke:var(--ok)}.ln.tmp{stroke:var(--gold);stroke-dasharray:2 9}.ln.wrong{stroke:var(--bad)}
.tcard{animation:cardin .9s cubic-bezier(.2,1.3,.4,1) both}
@keyframes cardin{from{transform:scale(.4) rotate(-8deg);opacity:0}}
.tcard .stars i{font-style:normal;display:inline-block;animation:starpop .6s cubic-bezier(.3,1.6,.5,1) both}
@keyframes starpop{0%{transform:scale(0) rotate(-120deg);opacity:0}100%{transform:none;opacity:1}}
.winbox{text-align:center;padding:6px 0 10px}
.wintitle{margin:6px 0 0;font-size:clamp(2.4rem,11vw,4rem);line-height:1.3;padding:.05em 0 .15em;background:linear-gradient(#ffd34d,#e09a12);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 rgba(0,0,0,.25));animation:wpulse 1.6s ease-in-out infinite}
@keyframes wpulse{50%{transform:scale(1.07)}}
.winbox .chest{max-width:320px;margin:0 auto;cursor:pointer;display:block;background:radial-gradient(closest-side,rgba(255,200,60,.35),transparent);border-radius:50%}
.winbox .chest .csv{max-width:none}
.wincount{font-size:1.5rem;font-weight:700;color:var(--teal2);margin-top:4px}
.winhint{margin:4px 0 14px;font-size:1.1rem;opacity:.85}
.coinfx{position:fixed;z-index:450;pointer-events:none;font-size:26px;margin:-13px 0 0 -13px;animation:cfly 1s ease-in forwards}
@keyframes cfly{to{transform:translate(var(--dx),calc(var(--dy) + 170px)) rotate(420deg);opacity:0}}
.cfx{position:fixed;inset:0;z-index:400;pointer-events:none;display:none}

.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(30px);background:#fff;color:var(--ink);padding:10px 18px;border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:.3s;z-index:500;font-weight:700;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

let AC = null, muted = false;
function ac() { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); return AC; }
function tone(f, t0, d, type, v, to) {
  if (muted) return;
  try {
    const c = ac(), o = c.createOscillator(), g = c.createGain(), t = c.currentTime + t0;
    o.type = type || 'sine'; o.frequency.setValueAtTime(f, t); if (to) o.frequency.exponentialRampToValueAtTime(to, t + d);
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v || .14, t + .012); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + d + .05);
  } catch (e) { console.warn('audio', e); }
}
function noise(t0, d, f, q, v) {
  if (muted) return;
  try {
    const c = ac(), n = Math.floor(c.sampleRate * d), buf = c.createBuffer(1, n, c.sampleRate), a = buf.getChannelData(0);
    for (let i = 0; i < n; i++) a[i] = Math.random() * 2 - 1;
    const s = c.createBufferSource(); s.buffer = buf;
    const fl = c.createBiquadFilter(); fl.type = 'bandpass'; fl.frequency.value = f; fl.Q.value = q || 1;
    const g = c.createGain(), t = c.currentTime + t0; g.gain.setValueAtTime(v || .1, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    s.connect(fl); fl.connect(g); g.connect(c.destination); s.start(t);
  } catch (e) { console.warn('audio', e); }
}

function confetti() {
  const c = $('#cf'); c.style.display = 'block'; c.width = innerWidth; c.height = innerHeight;
  const x = c.getContext('2d'), cols = ['#ffd34d','#34c3d6','#ff7a8a','#7be0a2','#ffffff'];
  const P = Array.from({length:150}, () => ({ x:Math.random()*c.width, y:-20-Math.random()*c.height*.5, r:4+Math.random()*6, vx:(Math.random()-.5)*3, vy:2+Math.random()*4, col:cols[Math.floor(Math.random()*cols.length)], rot:Math.random()*6 }));
  let f = 0;
  (function loop() {
    x.clearRect(0,0,c.width,c.height);
    P.forEach(p => { p.x += p.vx; p.y += p.vy; p.rot += .1; x.save(); x.translate(p.x,p.y); x.rotate(p.rot); x.fillStyle = p.col; x.fillRect(-p.r/2,-p.r/2,p.r,p.r*1.6); x.restore(); });
    if (++f < 160) requestAnimationFrame(loop); else { x.clearRect(0,0,c.width,c.height); c.style.display = 'none'; }
  })();
}

const gemSVG = `<svg class="gem" viewBox="0 0 40 40"><polygon points="20,3 35,14 20,37 5,14" fill="#31c6e8" stroke="#0b6a8a" stroke-width="2"/><polygon points="20,3 35,14 20,14" fill="#9ae6ff"/><polygon points="20,14 35,14 20,37" fill="#1b9cc4"/><polygon points="20,3 5,14 20,14" fill="#6fd6f2"/></svg>`;
function buildHome() {
  const g = $('#grid'); g.innerHTML = '';
  CH.forEach(c => {
    const b = el('button', 'chest', chestArt(c.n) + `<div class="cl"><span class="num">${c.n}</span><span class="chk">✓</span><b>${c.t}</b><small>${c.s}</small></div>`);
    b.dataset.n = c.n; b.setAttribute('aria-label', c.t);
    b.onclick = () => openChest(c.n);
    g.appendChild(b);
  });
  $('#gems').innerHTML = gemSVG + gemSVG + gemSVG;
  refreshHome();
}
function chestEl(n) { return document.querySelector(`.chest[data-n="${n}"]`); }
function refreshHome() {
  CH.forEach(c => {
    const e = chestEl(c.n);
    e.classList.toggle('done', !!state.done[c.n]);
    e.classList.toggle('open', !!state.done[c.n] || state.current === c.n);
    if (c.n === 4) { e.classList.toggle('locked', !allDone()); e.classList.toggle('ready', allDone() && !state.done[4]); }
  });
  document.querySelectorAll('#gems .gem').forEach((g, i) => g.classList.toggle('on', !!state.done[i + 1]));
  $('#reset').style.display = (state.done[1] || state.done[2] || state.done[3]) ? '' : 'none';
  $('#hintmain').textContent = allDone() ? (state.done[4] ? '' : '🎉 الصندوق الرابع انفتح لكِ — اضغطي عليه!') : 'اضغطي على أي صندوق من الصناديق الثلاثة الأولى لتبدئي.';
}
function openChest(n) {
  if (n === 4 && !allDone()) { toast('أكملي الألغاز الثلاثة أولاً لتفتحي هذا الصندوق 🔒'); const e = chestEl(4); e.animate([{transform:'translateX(0)'},{transform:'translateX(-8px)'},{transform:'translateX(8px)'},{transform:'translateX(0)'}],{duration:350}); sfx.locked(); return; }
  state.current = n; refreshHome(); sfx.open();
  setTimeout(() => showPanel(n), 750);
}
$('#reset').onclick = () => { if (confirm('هل تريدين إعادة اللعب من البداية؟')) { state.done = {1:false,2:false,3:false,4:false}; state.mistakes = 0; state.current = 0; refreshHome(); } };

   السحب والإفلات (يعمل بالفأرة وباللمس) + بديل: اضغطي البطاقة ثم المكان
   ===================================================================== */
let sel = null, zonesNow = [], placeFn = null;
function clearSel() { if (sel) sel.classList.remove('sel'); sel = null; zonesNow.forEach(z => z.classList.remove('pulse')); }
function selectCard(c) {
  if (sel === c) { clearSel(); return; }
  clearSel(); sel = c; c.classList.add('sel');
  zonesNow.forEach(z => { if (!z.classList.contains('ok')) z.classList.add('pulse'); });
}
function zoneAt(x, y) {
  let best = null, bd = 1e9;
  for (const z of zonesNow) {
    if (z.classList.contains('ok')) continue;
    const r = z.getBoundingClientRect(), p = 8;
    if (x >= r.left - p && x <= r.right + p && y >= r.top - p && y <= r.bottom + p) {
      const d = Math.hypot(x - (r.left + r.right) / 2, y - (r.top + r.bottom) / 2);
      if (d < bd) { bd = d; best = z; }
    }
  }
  return best;
}
function hot(z) { zonesNow.forEach(q => q.classList.toggle('hot', q === z)); }
function enableDrag(card) {
  card.addEventListener('pointerdown', e => {
    if (card.classList.contains('used') || (e.button && e.button !== 0)) return;
    e.preventDefault(); sfx.pick();
    const sx = e.clientX, sy = e.clientY, r = card.getBoundingClientRect(), ox = sx - r.left, oy = sy - r.top;
    let ghost = null, moved = false, lastY = sy, timer = null;
    const mv = ev => {
      lastY = ev.clientY;
      if (!moved && Math.hypot(ev.clientX - sx, ev.clientY - sy) > 7) {
        moved = true; clearSel();
        ghost = card.cloneNode(true); ghost.classList.add('ghost'); ghost.classList.remove('dragging'); ghost.style.width = r.width + 'px';
        document.body.appendChild(ghost); card.classList.add('dragging');
        timer = setInterval(() => { const P = $('#panel'); if (lastY < 90) P.scrollTop -= 14; else if (lastY > innerHeight - 90) P.scrollTop += 14; }, 16);
      }
      if (moved) { ghost.style.transform = `translate(${ev.clientX - ox}px,${ev.clientY - oy}px) rotate(-2deg)`; hot(zoneAt(ev.clientX, ev.clientY)); }
    };
    const up = ev => {
      window.removeEventListener('pointermove', mv); window.removeEventListener('pointerup', up); window.removeEventListener('pointercancel', up);
      clearInterval(timer);
      if (moved) {
        ghost.remove(); card.classList.remove('dragging'); const z = zoneAt(ev.clientX, ev.clientY); hot(null);
        if (z && ev.type !== 'pointercancel') placeFn(card, z);
      } else selectCard(card);
    };
    window.addEventListener('pointermove', mv); window.addEventListener('pointerup', up); window.addEventListener('pointercancel', up);
  });
}
function wrong(card, zone, msg) {
  state.mistakes++; sfx.bad();
  [card, zone].forEach(x => { x.classList.remove('bad'); void x.offsetWidth; x.classList.add('bad'); setTimeout(() => x.classList.remove('bad'), 450); });
  toast(msg || 'ليس هذا مكانها الصحيح، جرّبي مرة أخرى 💪');
}
function bindZone(z) { z.addEventListener('click', () => { if (sel && !z.classList.contains('ok')) placeFn(sel, z); }); }

function fitText(z, dg) {
  const cw = dg.clientWidth; let s = cw * 0.037; z.style.fontSize = s + 'px';
  // لو الاسم أطول من المربع نوسّع المربع قليلاً نحو داخل الرسم ليبقى الخط واضحًا
  const over = z.scrollWidth - z.clientWidth + 12;
  if (over > 0) {
    const pct = Math.min(over / cw * 100, 11);
    const l = parseFloat(z.style.left), w = parseFloat(z.style.width);
    if (l + w / 2 < 50) z.style.width = (w + pct) + '%'; else { z.style.left = (l - pct) + '%'; z.style.width = (w + pct) + '%'; }
  }
  while (z.scrollWidth > z.clientWidth - 4 && s > 8) { s -= .5; z.style.fontSize = s + 'px'; }
}

function buildP2(body) {
  $('#ptitle').textContent = '🧩 لغز المطابقة';
  zonesNow = []; placeFn = null;
  body.appendChild(el('p', 'hint', 'صلي كل تركيب بوظيفته: اسحبي خطًا من التركيب إلى وظيفته، أو اضغطي التركيب ثم وظيفته.'));
  const NS = 'http://www.w3.org/2000/svg';
  const wrap = el('div', 'mwrap'), svg = document.createElementNS(NS, 'svg'); svg.setAttribute('class', 'mlines');
  const cA = el('div', 'mcol'), cB = el('div', 'mcol');
  P2.forEach(p => { const s = el('div', 'mi ms', `<img src="${p.img}" alt=""><span>${p.n}</span><i class="dot"></i>`); s.dataset.k = p.k; cA.appendChild(s); });
  shuffle(P2).forEach(p => { const f = el('div', 'mi mf', `<span>${p.f}</span><i class="dot"></i>`); f.dataset.k = p.k; cB.appendChild(f); });
  wrap.append(cA, cB, svg); body.appendChild(wrap);
  body.appendChild(el('div', 'prog', `<span>طابقتِ <b id="pc">0</b> من ${P2.length}</span><span>⭐ استمري!</span>`));

  body.appendChild(el('p', 'hint', 'اكتبي توقّعك في المربع ثم اضغطي «تحقّقي».')).style.marginTop = '14px';
  const ta = el('textarea', 'ans'); ta.rows = 3; ta.placeholder = 'اكتبي إجابتك هنا...'; body.appendChild(ta);
  const tip = el('div', 'tip', '💭 ' + P3.tip); body.appendChild(tip);
  const row = el('div'); row.style.cssText = 'display:flex;gap:10px;flex-wrap:wrap;margin-top:10px';
  const chk = el('button', 'btn', 'تحقّقي ✓'), show = el('button', 'btn alt', 'اعرضي الإجابة'); show.style.display = 'none';
  row.append(chk, show); body.appendChild(row);
  let tries = 0;
  const norm = s => s.replace(/[\u064B-\u0652\u0640]/g, '').replace(/[أإآ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي');
  const good = s => { s = norm(s); return /(تضيق|يضيق|ضيق|تضييق|انسداد|تنسد|تنغلق|ينغلق|تنطبق|تنهار|تغلق|تقفل)/.test(s) || /(يعيق|تعيق|يعوق|تعوق|صعوب|يقل|يقل)/.test(s); };
  const win = () => {
    ta.disabled = true; chk.disabled = true; show.style.display = 'none'; tip.style.display = 'none'; sfx.ok();
    body.appendChild(el('div', 'tip', '✅ الإجابة: <b>' + P3.right + '</b><br>' + P3.why)).style.display = 'block';
    solved('أحسنتِ الاستنتاج! 🎉');
  };
  chk.onclick = () => {
    if (!ta.value.trim()) { toast('اكتبي إجابتك أولاً ✍️'); return; }
    if (good(ta.value)) { win(); return; }
    tries++; state.mistakes++; sfx.bad(); tip.style.display = 'block';
    ta.classList.remove('bad'); void ta.offsetWidth; ta.classList.add('bad');
    if (tries >= 2) show.style.display = '';
  };
  show.onclick = win;
}

/* =====================================================================
   الصندوق الرابع: بطاقة الكنز
   ===================================================================== */
let tapCount = 0;
function coinBurst(x, y) {
  for (let i = 0; i < 12; i++) {
    const c = el('div', 'coinfx', '🪙'); c.style.left = x + 'px'; c.style.top = y + 'px';
    const a = Math.random() * Math.PI * 2, d = 50 + Math.random() * 130;
    c.style.setProperty('--dx', Math.cos(a) * d + 'px'); c.style.setProperty('--dy', Math.sin(a) * d - 90 + 'px');
    document.body.appendChild(c); setTimeout(() => c.remove(), 1000);
  }
}
function buildTreasure(body) {
  $('#ptitle').textContent = '🏆 الكنز';
  zonesNow = []; placeFn = null; tapCount = 0;
  const w = el('div', 'winbox');
  w.appendChild(el('h3', 'wintitle', 'لقد ربحتِ!'));
  const ch = el('div', 'chest open', chestArt(0)); ch.setAttribute('role', 'button'); ch.setAttribute('aria-label', 'اضغطي على الكنز');
  w.appendChild(ch);
  const cnt = el('div', 'wincount', '🪙 × 0'); w.appendChild(cnt);
  w.appendChild(el('p', 'winhint', 'اضغطي على الكنز لتنثري الذهب!'));
  const back = el('button', 'btn', 'العودة للصناديق'); back.onclick = () => { puzzleSolved = true; closePanel(); }; w.appendChild(back);
  body.appendChild(w);
  const tap = e => {
    tapCount++; cnt.textContent = '🪙 × ' + tapCount * 12; coinBurst(e.clientX, e.clientY);
    sfx.coin(); ch.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.08) rotate(-2deg)' }, { transform: 'scale(1)' }], { duration: 250 });
    if (tapCount % 5 === 0) { confetti(); sfx.win(); }
  };
  ch.addEventListener('click', tap);
  puzzleSolved = true; state.finished = true; sfx.treasure(); confetti(); setTimeout(confetti, 1800);
}

/* ---------- فقاعات الخلفية ---------- */
for (let i = 0; i < 9; i++) { const b = el('div', 'bub'); const s = 14 + Math.random() * 34; b.style.cssText = `width:${s}px;height:${s}px;left:${Math.random()*100}%;animation-duration:${14+Math.random()*16}s;animation-delay:${-Math.random()*20}s`; document.body.appendChild(b); }
buildHome();
